# Lint, typecheck, test and compile on every pull request and push to main.
# Windows runner, because the desktop shell (ConPTY terminal, Portal webviews,
# signtool) only builds there.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # tauri::generate_context! embeds frontendDist (../dist), so the web build
      # has to exist before cargo can compile the app.
      - name: Web build
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

  # Playwright smoke test (e2e/smoke.spec.ts) against the real Supabase project,
  # signed in as a dedicated test account. Runs alongside `check`. Without the
  # E2E_EMAIL / E2E_PASSWORD secrets (fork PRs) the tests skip instead of failing.
  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Uses the Edge preinstalled on the runner (channel "msedge"), so no
      # Playwright browser download.
      - name: E2E smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
