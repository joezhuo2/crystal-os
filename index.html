<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crystal OS — Productivity Ecosystem</title>
    <meta name="description" content="A premium glassmorphic productivity ecosystem for tasks, finances, and focus." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!--
      Boot splash. Inlined so it paints before the app bundle loads; React
      replaces the markup in #root on its first render. AppSplash
      (src/components/layout/AppSplash.tsx) reuses these classes while the
      session is being restored, so the handover does not flicker.
      The Orbit's black hole sits behind it (and behind LoginPage, which
      shares .boot-scene and .boot-glass): public/orbit-splash.webp is
      orbit-backdrop.webp pre-blurred at the page's 15% Image blur, so it
      needs no bundle, no bake and no live CSS blur.
    -->
    <style>
      html, body { background: #000; }
      .boot-scene {
        background-color: #000;
        background-image:
          radial-gradient(ellipse at 50% 50%, rgb(3 5 16 / 0.15), rgb(1 2 8 / 0.55) 75%),
          url("/orbit-splash.webp");
        background-size: cover, cover;
        background-position: center, 45% 45%;
        color: #f5fbff;
      }
      .boot-glass {
        border-radius: 1.25rem;
        background: linear-gradient(160deg, rgb(14 22 48 / 0.22), rgb(3 5 16 / 0.42));
        border: 1px solid rgb(207 239 252 / 0.16);
        box-shadow: 0 8px 32px rgb(0 2 14 / 0.45), 0 0 40px rgb(125 211 252 / 0.08), inset 0 1px 0 rgb(224 246 255 / 0.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.2);
        backdrop-filter: blur(14px) saturate(1.2);
      }
      .boot-splash {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center; padding: 16px;
        font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-splash-panel {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        padding: 36px 56px;
        text-shadow: 0 1px 8px rgb(2 4 14 / 0.75);
      }
      .boot-splash-gem { width: 56px; height: 56px; filter: drop-shadow(0 0 18px rgb(125 211 252 / 0.55)); animation: boot-float 2.8s ease-in-out infinite; }
      .boot-splash-title {
        margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(100deg, #f0fbff, #a5e9fb 35%, #8fa7d9 65%, #c9a9d8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: none;
      }
      .boot-splash-status { margin: 0; font-size: 13px; letter-spacing: 0.08em; color: hsl(220 26% 76%); }
      .boot-splash-bar { position: relative; width: 160px; height: 3px; overflow: hidden; border-radius: 999px; background: rgb(207 239 252 / 0.14); }
      .boot-splash-bar::after {
        content: ""; position: absolute; inset: 0; width: 40%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #a5e9fb, #c9a9d8, transparent);
        animation: boot-sweep 1.3s ease-in-out infinite;
      }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-gem, .boot-splash-bar::after { animation: none; }
        .boot-splash-bar::after { width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash boot-scene" role="status" aria-label="Loading Crystal OS">
        <div class="boot-splash-panel boot-glass">
          <svg class="boot-splash-gem" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="boot-gem" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
                <stop stop-color="#f0fbff" />
                <stop offset="0.5" stop-color="#67d4f0" />
                <stop offset="1" stop-color="#c9a9d8" />
              </linearGradient>
            </defs>
            <path d="M20 8h24l14 16-26 32L6 24 20 8Z" fill="url(#boot-gem)" fill-opacity="0.22" stroke="url(#boot-gem)" stroke-width="2.5" stroke-linejoin="round" />
            <path d="M6 24h52M20 8l12 48M44 8 32 56M20 8l-2 16M44 8l2 16" stroke="url(#boot-gem)" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" />
          </svg>
          <h1 class="boot-splash-title">Crystal OS</h1>
          <div class="boot-splash-bar"></div>
          <p class="boot-splash-status">Loading…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
