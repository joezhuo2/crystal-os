[package]
name = "crystal-os"
version = "0.7.0"
description = "Crystal OS desktop shell"
authors = ["Joe Zhuo"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "crystal_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
notify-debouncer-mini = "0.7.0"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
portable-pty = "0.9.0"
ureq = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# Same versions wry uses, for the Portal's WebView2 snapshot and shortcut hooks.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
